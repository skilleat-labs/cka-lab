# app=api 파드는 monitoring 네임스페이스의 모든 파드에서 9090 으로 받는다
# kubernetes.io/metadata.name 은 모든 네임스페이스에 자동으로 붙는 레이블
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-monitoring
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9090
