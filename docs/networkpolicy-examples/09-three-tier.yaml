# 3계층 앱 격리 — frontend → backend → db
#
#   외부 ──:80──► web(frontend) ──:8080──► api(backend) ──:3306──► db
#   web 이 db 로 직접 가는 건 차단된다
#
# 사용 전:  kubectl create namespace prod
#          파드 레이블 app=web / app=api / app=db 로 배포
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-allow-backend
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api
    ports:
    - protocol: TCP
      port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-frontend
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: web
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-allow-all-80
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Ingress]
  ingress:
  - ports:                     # from 생략 = 출발지 무관, 80 포트만
    - protocol: TCP
      port: 80
