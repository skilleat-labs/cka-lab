<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CKA 실습 시험</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root{
    --blue:#1D6FE0; --ink:#1A1A1A; --muted:#5C5C5C; --hair:#E2E2E2;
    --bluetint:#EAF2FD; --gray:#F6F6F6; --white:#fff;
    --mono:"D2Coding","SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
    --sans:"NanumSquare","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --head:58px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--white);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
  header{border-bottom:1px solid var(--hair);padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
    position:sticky;top:0;background:var(--white);z-index:5;height:var(--head)}
  header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
  header .sub{color:var(--muted);font-size:13px;white-space:nowrap}
  select{font-family:var(--sans);font-size:14px;padding:6px 8px;border:1px solid var(--hair);border-radius:6px;background:var(--white);color:var(--ink);max-width:min(40vw,400px)}
  .spacer{flex:1}
  .timer{font-family:var(--mono);font-size:14px;color:var(--muted);white-space:nowrap}
  .timer.warn{color:#b45309;font-weight:700}
  .timer.over{color:#b91c1c;font-weight:700}
  @keyframes tickpulse{0%,100%{opacity:1}50%{opacity:.45}}
  .timer.warn .lefticon{animation:tickpulse 1s ease-in-out infinite}
  .timebar{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;
    border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;font-weight:600}
  .timebar.over{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
  .dots{display:flex;gap:6px;align-items:center}
  .langsw{display:flex;border:1px solid var(--hair);border-radius:6px;overflow:hidden}
  .langsw button{border:0;border-radius:0;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--white)}
  .langsw button.on{background:var(--bluetint);color:var(--blue)}
  .langsw button:disabled{opacity:.35}
  .dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--hair);background:var(--white)}
  .dot.full{background:var(--blue);border-color:var(--blue)}
  .dot.part{background:var(--bluetint);border-color:var(--blue)}
  .dot.cur{border-color:var(--blue);border-width:3px}

  main{display:grid;grid-template-columns:minmax(0,1fr) 6px var(--sidew, 52%);gap:14px;padding:18px;align-items:start}
  .side{position:sticky;top:calc(var(--head) + 18px);height:calc(100vh - var(--head) - 36px);display:flex;flex-direction:column;gap:12px;min-width:0}

  /* 드래그로 폭 조절 */
  #resizer{position:sticky;top:calc(var(--head) + 18px);height:calc(100vh - var(--head) - 36px);
    width:6px;border-radius:3px;background:var(--hair);cursor:col-resize;opacity:.6;transition:opacity .15s,background .15s}
  #resizer:hover,#resizer.on{background:var(--blue);opacity:1}
  #resizer::after{content:"";position:absolute;inset:0 -8px}   /* 집기 쉽게 */

  /* 문제/터미널 좌우 바꾸기 */
  body.swap main{grid-template-columns:var(--sidew, 52%) 6px minmax(0,1fr)}
  body.swap .side{order:1}
  body.swap #resizer{order:2}
  body.swap #left{order:3}

  /* 터미널만 넓게 보기 */
  body.termfull #left, body.termfull #resizer{display:none}
  body.termfull main{grid-template-columns:1fr}

  @media (max-width:1100px){
    main{grid-template-columns:1fr}
    #resizer{display:none}
    .side{position:static;height:auto}
    #termcard{height:62vh}
  }

  .card{border:1px solid var(--hair);border-radius:10px;padding:16px 18px;margin-bottom:14px;background:var(--white)}
  .card h2{font-size:15px;margin:0 0 10px;font-weight:700}
  .card h2 .n{color:var(--blue);margin-right:8px}
  pre.q{font-family:var(--mono);font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;margin:0;background:var(--gray);border-radius:8px;padding:15px}
  .bar{display:flex;gap:8px;flex-wrap:wrap}
  button{font-family:var(--sans);font-size:14px;font-weight:700;padding:8px 15px;border-radius:7px;border:1px solid var(--hair);background:var(--white);color:var(--ink);cursor:pointer}
  button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
  button.primary{background:var(--blue);border-color:var(--blue);color:var(--white)}
  button.primary:hover:not(:disabled){opacity:.9;color:var(--white)}
  button.quiet{color:var(--muted);font-weight:400;font-size:13px;padding:6px 11px}
  button:disabled{opacity:.45;cursor:default}
  .score{font-family:var(--mono);font-size:22px;font-weight:700}
  .score .of{color:var(--muted);font-size:14px;font-weight:400}
  ul.items{list-style:none;margin:0;padding:0}
  ul.items li{display:flex;gap:10px;padding:7px 9px;border-radius:6px;align-items:flex-start;font-size:13.5px}
  ul.items li.fail{background:var(--gray);border-left:3px solid var(--ink)}
  ul.items li.pass{border-left:3px solid var(--bluetint)}
  .mark{font-weight:700;font-family:var(--mono);flex:none;width:18px;text-align:center}
  li.pass .mark{color:var(--blue)}
  li.fail .mark{color:var(--ink)}
  .note{display:block;color:var(--muted);font-size:12px;font-family:var(--mono);margin-top:3px;word-break:break-all}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--hair)}
  th{color:var(--blue);background:var(--bluetint);font-weight:700}
  tr.cur td{background:var(--bluetint)}
  tr.go{cursor:pointer}
  tr.go:hover td{background:var(--gray)}
  tr.go.cur:hover td{background:var(--bluetint)}
  td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
  .tag{font-size:11px;color:var(--muted);border:1px solid var(--hair);border-radius:4px;padding:1px 5px;margin-left:4px}
  .log{font-family:var(--mono);font-size:12px;white-space:pre-wrap;background:var(--gray);border-radius:8px;padding:13px;max-height:300px;overflow:auto;margin:0}
  .muted{color:var(--muted)}
  .banner{background:var(--bluetint);border-radius:8px;padding:11px 15px;font-size:13.5px;margin-bottom:14px}
  .running{display:flex;gap:10px;align-items:center;color:var(--blue);font-size:14px;font-weight:700}
  .spin{width:14px;height:14px;border:2px solid var(--bluetint);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* 터미널 */
  #actions{flex:none}
  #actions .card{margin:0}
  #termcard{flex:1;min-height:0;display:flex;flex-direction:column;padding:0;margin:0;border:1px solid var(--hair);border-radius:10px;overflow:hidden;background:var(--ink)}
  .termhead{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid #2E2E2E;color:#CFCFCF;font-size:12px;font-family:var(--mono)}
  .termhead button{background:transparent;border-color:#3A3A3A;color:#CFCFCF;font-size:12px;font-weight:400;padding:3px 9px}
  .termhead button:hover{border-color:var(--blue);color:#fff}
  .termhead .muted{color:#8A8A8A}
  #term{flex:1;min-height:0;padding:6px 8px}
  .xterm-viewport::-webkit-scrollbar{width:10px}
  .xterm-viewport::-webkit-scrollbar-thumb{background:#3A3A3A;border-radius:5px}
</style>
</head>
<body>
<header>
  <h1>CKA 실습 시험</h1>
  <select id="sets"></select>
  <span class="sub" id="setSub"></span>
  <span class="spacer"></span>
  <span class="langsw" id="langsw"></span>
  <span class="dots" id="dots"></span>
  <span class="timer" id="timer"></span>
</header>

<main>
  <div id="left"></div>
  <div id="resizer" title="드래그해서 너비 조절 · 더블클릭하면 기본값"></div>
  <aside class="side">
    <div id="actions"></div>
    <div class="card" id="termcard">
      <div class="termhead">
        <span id="termpath">터미널</span><span id="termstat" class="muted">연결 중…</span>
        <span class="spacer"></span>
        <button id="termswap" title="문제와 터미널 좌우 바꾸기">⇄</button>
        <button id="termwide" title="터미널만 넓게 (다시 누르면 복귀)">⤢</button>
        <button id="fontminus" title="글자 작게">A−</button>
        <button id="fontplus" title="글자 크게">A+</button>
        <button id="reconnect">재연결</button>
      </div>
      <div id="term"></div>
    </div>
  </aside>
</main>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script>
const $ = s => document.querySelector(s);
let SET = localStorage.getItem('cka.set') || '';
let ST = null, JOB = null, TICK = null, HINT = null;   // HINT = {q, text, open}
let CFG = {shell:true};
let LANG = localStorage.getItem('cka.lang') || 'en';

const fmt = s => { s = Math.max(0, s|0); return `${(s/60)|0}분 ${String(s%60).padStart(2,'0')}초`; };
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(path, opts){ const r = await fetch(path, opts); return r.json(); }

// ── 터미널 ──────────────────────────────────────────────────────────
let term = null, fit = null, ws = null, TERMSET = '', typedLine = '', reTry = 0, closing = false, fontSize = +(localStorage.getItem('cka.font') || 13);

const termStat = t => { $('#termstat').textContent = t; };

function initTerm(){
  term = new Terminal({
    fontFamily: '"D2Coding", ui-monospace, Menlo, Consolas, monospace',
    fontSize, cursorBlink: true, scrollback: 5000,
    theme: {background:'#1A1A1A', foreground:'#EDEDED', cursor:'#1D6FE0',
            selectionBackground:'#1D6FE0', selectionForeground:'#FFFFFF'},
  });
  fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($('#term'));
  refit();
  term.onData(d => {
    if(ws && ws.readyState === 1) ws.send(new TextEncoder().encode(d));
    for(const ch of d){                      // 빈 줄일 때만 즉시 이동할 수 있으므로 추적
      if(ch === '\r' || ch === '\n' || ch === '\x03' || ch === '\x15') typedLine = '';
      else if(ch === '\x7f') typedLine = typedLine.slice(0, -1);
      else if(ch >= ' ') typedLine += ch;
    }
  });
  new ResizeObserver(() => refit()).observe($('#term'));
  $('#reconnect').onclick = () => { reTry = 0; closing = true; try{ ws && ws.close(); }catch(e){} connect(); };
  $('#fontplus').onclick = () => setFont(fontSize + 1);
  $('#fontminus').onclick = () => setFont(fontSize - 1);
  initResizer();
  connect();
}

// ── 좌우 폭 조절 ────────────────────────────────────────────────────
const DEFAULT_SIDE = '52%';
function setSide(px){
  document.documentElement.style.setProperty('--sidew', px ? px + 'px' : DEFAULT_SIDE);
  if(px) localStorage.setItem('cka.sidew', px); else localStorage.removeItem('cka.sidew');
  refit();
}

function initResizer(){
  const saved = +(localStorage.getItem('cka.sidew') || 0);
  if(saved) setSide(Math.min(saved, window.innerWidth - 360));
  const r = $('#resizer');
  if(!r) return;
  let drag = null;
  r.addEventListener('pointerdown', e => {
    drag = {x: e.clientX, w: $('.side').getBoundingClientRect().width};
    r.setPointerCapture(e.pointerId); r.classList.add('on');
    document.body.style.userSelect = 'none';
  });
  r.addEventListener('pointermove', e => {
    if(!drag) return;
    const d = e.clientX - drag.x;
    const w = Math.max(360, Math.min(window.innerWidth - 360,
      document.body.classList.contains('swap') ? drag.w + d : drag.w - d));
    setSide(Math.round(w));
    if(term) termStat(term.cols + '×' + term.rows);
  });
  const end = () => { if(!drag) return; drag = null; r.classList.remove('on');
    document.body.style.userSelect = ''; setTimeout(() => termStat(''), 900); };
  r.addEventListener('pointerup', end);
  r.addEventListener('pointercancel', end);
  r.addEventListener('dblclick', () => setSide(null));

  if(localStorage.getItem('cka.swap') === '1') document.body.classList.add('swap');
  $('#termswap').onclick = () => {
    const on = document.body.classList.toggle('swap');
    localStorage.setItem('cka.swap', on ? '1' : '0');
    setTimeout(() => { refit(); if(term) term.focus(); }, 30);
  };

  $('#termwide').onclick = () => {
    document.body.classList.toggle('termfull');
    $('#termwide').textContent = document.body.classList.contains('termfull') ? '⤡' : '⤢';
    setTimeout(() => { refit(); if(term) term.focus(); }, 30);
  };
  window.addEventListener('resize', () => {
    const w = $('.side').getBoundingClientRect().width;
    if(w > window.innerWidth - 300) setSide(null);
  });
}

function setFont(n){
  fontSize = Math.min(22, Math.max(9, n));
  localStorage.setItem('cka.font', fontSize);
  term.options.fontSize = fontSize;
  refit();
}

function refit(){
  try{ fit.fit(); }catch(e){}
  if(ws && ws.readyState === 1) ws.send(JSON.stringify({r: term.rows, c: term.cols}));
}

// 세트를 바꾸면 셸도 그 폴더로 — 명령을 주입하지 않고 포인터 파일 + 프롬프트 훅으로
function followSet(){
  if(!ws || ws.readyState !== 1) return;
  const idle = typedLine.length === 0;
  ws.send(JSON.stringify({cd: SET, idle}));
  TERMSET = SET;
  $('#termpath').textContent = '~/cka-lab/' + SET;
  if(!idle){ termStat('입력 중 — 엔터 치면 이동'); setTimeout(() => termStat(''), 2500); }
}

function connect(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  termStat('연결 중…');
  ws = new WebSocket(`${proto}://${location.host}/ws?set=${encodeURIComponent(SET)}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    reTry = 0; TERMSET = SET; $('#termpath').textContent = '~/cka-lab/' + SET;
    termStat(''); refit(); term.focus();
  };
  ws.onmessage = e => term.write(new Uint8Array(e.data));
  ws.onerror = () => termStat('연결 실패');
  ws.onclose = () => {                       // 끊기면 스스로 다시 붙는다
    if(closing){ closing = false; return; }
    if(reTry >= 8){ termStat('연결 끊김 — 재연결을 누르세요'); return; }
    const wait = Math.min(1000 * Math.pow(1.6, reTry++), 8000);
    termStat(`연결 끊김 — ${Math.round(wait/1000)}초 뒤 다시 연결`);
    setTimeout(connect, wait);
  };
}

// ── 상태 ────────────────────────────────────────────────────────────
function setOptions(sets){
  $('#sets').innerHTML = sets.map(s =>
    `<option value="${s.id}" ${s.id===SET?'selected':''}>${esc(s.id)} — ${esc(s.title)}${s.done?'  ✓ 완료':(s.running?`  (Q${s.current} 진행 중)`:'')}</option>`).join('');
}

async function loadSets(){
  const sets = await api('/api/sets');
  if(!sets.length){ $('#left').innerHTML = '<div class="card">exam.sh 가 있는 세트를 찾지 못했습니다.</div>'; return; }
  if(!sets.find(s => s.id === SET)) SET = sets[0].id;
  setOptions(sets);
  await refresh();
}

async function refresh(){
  ST = await api('/api/state?set=' + encodeURIComponent(SET) + '&lang=' + LANG);
  if(ST) ST._recv = Math.floor(Date.now()/1000);   // 서버 시각 보정용
  render();
}

function renderDots(){
  if(!ST || !ST.nq){ $('#dots').innerHTML=''; return; }
  $('#dots').innerHTML = ST.rows.map(r => {
    let c = 'dot';
    if(r.pass !== null) c += (r.pass === r.total) ? ' full' : ' part';
    if(r.current) c += ' cur';
    return `<span class="${c}" title="Q${r.n} ${esc(r.title)}"></span>`;
  }).join('');
}

// 서버 시각과 브라우저 시각이 다를 수 있으므로, 받아온 now 로 보정해서 센다
function serverNow(){
  return Math.floor(Date.now()/1000) + (ST && ST.now ? ST.now - ST._recv : 0);
}

function timeLeft(){                 // 제한이 없으면 null
  if(!ST || !ST.limit || !ST.started) return null;
  return ST.limit * 60 - (serverNow() - ST.started);
}

function fmtLeft(l){
  if(l < 0) return Math.ceil(-l/60) + '분 초과';
  return fmt(l);
}

function renderTimer(){
  clearInterval(TICK);
  const el = $('#timer');
  if(!ST || !ST.started){ el.textContent=''; el.className='timer'; return; }
  const base = ST.finished || 0;

  const draw = () => {
    const left = timeLeft();
    if(left === null){                               // 제한 없음 — 예전처럼 경과 시간
      const end = base || serverNow();
      el.className = 'timer';
      el.textContent = (base ? '총 ' : '경과 ') + fmt(end - ST.started);
      return;
    }
    if(ST.timeup || left <= 0){
      el.className = 'timer over';
      el.textContent = '⏰ 시간 종료';
      clearInterval(TICK);
      if(!ST.timeup) refresh();                      // 서버에도 마감을 알린다
      return;
    }
    const warn = left <= (ST.warn || 10) * 60;
    el.className = 'timer' + (warn ? ' warn' : '');
    el.innerHTML = (warn ? '<span class="lefticon">⏰</span> ' : '⏱ ')
                 + esc(fmtLeft(left)) + ' 남음';
  };
  draw();
  if(!base || (ST.limit && !ST.timeup)) TICK = setInterval(draw, 1000);
}

// 문제 위에 띄우는 큰 알림 (10분 남았을 때 · 시간이 끝났을 때)
function timeBarHTML(){
  const left = timeLeft();
  if(left === null) return '';
  if(ST.timeup || left <= 0){
    return `<div class="timebar over">⏰ 제한시간 ${ST.limit}분이 지나 시험이 마감됐습니다.
      풀지 못한 문제는 0점입니다. 다시 풀려면 <b>시험 시작</b>을 누르세요 (기록이 초기화됩니다).</div>`;
  }
  if(left <= (ST.warn || 10) * 60){
    return `<div class="timebar">⏰ ${esc(fmtLeft(left))} 남았습니다.
      시간이 지나면 남은 문제는 0점으로 확정됩니다.</div>`;
  }
  return '';
}

function renderLang(){
  const koOff = ST.current && !ST.done && !ST.hasKo;
  $('#langsw').innerHTML =
    `<button data-lang="en" class="${LANG==='en'?'on':''}">EN</button>` +
    `<button data-lang="ko" class="${LANG==='ko'?'on':''}" ${koOff?'disabled title="이 문제는 한글판이 아직 없습니다"':''}>KO</button>`;
  $('#langsw').querySelectorAll('button').forEach(b => b.onclick = async () => {
    LANG = b.dataset.lang; localStorage.setItem('cka.lang', LANG); await refresh();
  });
}

function render(){
  $('#setSub').textContent = ST.nq ? `${ST.nq}문제 · ${ST.unit}` : '';
  renderDots(); renderTimer(); renderLang();
  $('#left').innerHTML = leftHTML();
  $('#actions').innerHTML = actionsHTML();
  bind();
}

// ── 왼쪽: 문제 · 힌트 · 채점 결과 · 진행 현황 ────────────────────────
function leftHTML(){
  if(JOB && !JOB.done){
    return `<div class="card">
      <div class="running"><span class="spin"></span>${esc(cmdLabel(JOB.cmd))} 실행 중…</div>
      <p class="muted" style="font-size:13px">클러스터에 실제로 요청을 보냅니다. 몇 초에서 1~2분 걸릴 수 있습니다.</p>
      <pre class="log" id="joblog">${esc(JOB.output || '')}</pre></div>`;
  }
  if(!ST.current){
    return `<div class="card">
      <h2>아직 시작하지 않았습니다</h2>
      <div class="banner">시험을 시작하면 이전 시험 리소스를 정리하고 환경을 준비한 뒤 1번 문제가 나옵니다.
        문제는 여기에서 읽고 <b>kubectl 은 오른쪽 터미널</b>에서 칩니다. 다 풀었으면 채점을 누르세요.
        지문은 실제 시험처럼 <b>영어</b>가 기본입니다 — 막히면 오른쪽 위 <b>KO</b> 로 한글을 봅니다.</div>
      ${ST.limit ? `<div class="timebar">⏱ 제한시간 <b>${ST.limit}분</b>입니다.
        ${ST.warn || 10}분 남으면 알려 드리고, 시간이 지나면 남은 문제는 0점으로 확정됩니다.</div>` : ''}
      <div class="bar"><button class="primary" data-cmd="start">시험 시작</button></div></div>`;
  }
  if(ST.done) return reportHTML();

  const q = ST.question || {};
  const hint = hintOpen()
    ? `<div class="card"><h2>힌트 <span class="muted" style="font-weight:400">— 리포트에 기록이 남습니다</span></h2>
       <pre class="q">${esc(HINT.text)}</pre></div>` : '';
  return timeBarHTML()
    + `<div class="card">
      <h2><span class="n">Q${q.n} / ${ST.nq}</span>${esc(q.title)}</h2>
      <pre class="q">${esc(q.body)}</pre></div>`
    + hint + resultHTML() + statusHTML();
}

function hintShown(){ return !!(HINT && ST && HINT.q === ST.current); }
function hintOpen(){ return hintShown() && HINT.open; }

function resultHTML(){
  const items = ST.items || [];
  if(!items.length) return '';
  const p = items.filter(i => i.ok).reduce((a,b) => a + (b.pts||1), 0);
  const t = items.reduce((a,b) => a + (b.pts||1), 0);
  return `<div class="card">
    <h2>채점 결과 <span class="muted" style="font-weight:400">${p}/${t} ${esc(ST.unit)}</span></h2>
    <ul class="items">${items.map(i => `<li class="${i.ok?'pass':'fail'}">
      <span class="mark">${i.ok?'✓':'✕'}</span>
      <span>${esc(i.desc)}${i.note ? `<span class="note">${esc(i.note)}</span>` : ''}</span></li>`).join('')}</ul>
    ${items.some(i => !i.ok) ? '<p class="muted" style="font-size:13px;margin-bottom:0">✕ 항목을 고치고 다시 채점하세요.</p>' : ''}
  </div>`;
}

function statusHTML(){
  return `<div class="card"><h2>진행 현황</h2>${tableHTML()}
    <div class="bar" style="margin-top:12px">
      <button class="quiet" data-cmd="finish">리포트 보기</button>
      <button class="quiet" data-cmd="clean" data-confirm="클러스터의 이 시험 리소스를 전부 삭제하고 진행 기록도 지웁니다. 계속할까요?">원상복구</button>
    </div></div>`;
}

function reportHTML(){
  const pct = ST.total ? Math.round(ST.sum*100/ST.total) : 0;
  return (ST.timeup
      ? `<div class="timebar over">⏰ 제한시간 ${ST.limit}분이 지나 마감됐습니다.
          풀지 못한 문제는 0점으로 들어갔습니다. 다시 풀려면 <b>시험 시작</b>을 누르세요.</div>`
      : '')
    + `<div class="card">
    <h2>최종 리포트 — ${esc(ST.title)}</h2>
    <div class="score">${ST.sum} <span class="of">/ ${ST.total} ${esc(ST.unit)} · ${pct}%</span></div>
    <div class="banner" style="margin-top:10px">${pct >= 66 ? '합격선(66%) 통과' : '합격선(66%) 미달'}
      · 총 소요 ${fmt((ST.finished || ST.now) - ST.started)}</div>
    ${tableHTML()}
    <div class="bar" style="margin-top:14px">
      <button data-cmd="start" data-confirm="처음부터 다시 시작합니다. 진행 기록이 지워집니다. 계속할까요?">다시 시작</button>
      <button class="quiet" data-cmd="clean" data-confirm="클러스터의 이 시험 리소스를 전부 삭제하고 진행 기록도 지웁니다. 계속할까요?">원상복구</button>
    </div></div>`;
}

function tableHTML(){
  return `<table><thead><tr><th>문제</th><th style="text-align:right">점수</th><th style="text-align:right">시간</th></tr></thead><tbody>
    ${ST.rows.map(r => `<tr class="${r.current?'cur':''}${ST.done?'':' go'}" ${ST.done?'':`data-go="${r.n}"`} title="${ST.done?'':'클릭하면 이 문제로 이동'}">
      <td>Q${r.n} ${esc(r.title)}
        ${r.skipped?'<span class="tag">skip</span>':''}${r.hint?'<span class="tag">hint</span>':''}${r.tries>1?`<span class="tag">${r.tries}회</span>`:''}</td>
      <td class="num">${r.pass===null ? '<span class="muted">—</span>' : `${r.pass}/${r.total}`}</td>
      <td class="num muted">${r.elapsed===null ? '' : fmt(r.elapsed)}</td></tr>`).join('')}
  </tbody></table>`;
}

// ── 오른쪽 위: 버튼 바 ──────────────────────────────────────────────
function actionsHTML(){
  const busy = JOB && !JOB.done;
  if(!ST.current || ST.done){
    return `<div class="card"><p class="muted" style="margin:0;font-size:13px">
      ${ST.done ? (ST.timeup ? '제한시간이 끝났습니다. 리포트는 왼쪽에 있습니다.' : '시험을 마쳤습니다. 리포트는 왼쪽에 있습니다.') : '왼쪽에서 시험을 시작하세요.'}
      터미널은 언제든 쓸 수 있습니다.</p></div>`;
  }
  return `<div class="card"><div class="bar">
      <button class="primary" data-cmd="check" ${busy?'disabled':''}>채점</button>
      ${ST.hasHint ? `<button data-cmd="hint" ${busy?'disabled':''}
        aria-expanded="${hintOpen()}">${hintOpen() ? '힌트 숨기기' : '힌트'}</button>` : ''}
      <button data-cmd="skip" ${busy?'disabled':''}>넘어가기</button>
      <span class="spacer"></span>
      <button class="quiet" data-go="${ST.current-1}" ${busy||ST.current<=1?'disabled':''} title="이전 문제">◀</button>
      <span class="muted" style="font-size:12.5px;align-self:center">Q${ST.current} / ${ST.nq}</span>
      <button class="quiet" data-go="${ST.current+1}" ${busy||ST.current>=ST.nq?'disabled':''} title="다음 문제">▶</button>
    </div></div>`;
}

const cmdLabel = c =>
  ({start:'시험 시작', check:'채점', skip:'넘어가기', hint:'힌트', finish:'리포트', clean:'원상복구', reset:'기록 삭제'}[c] || c);

function bind(){
  document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => run(b.dataset.cmd, b.dataset.confirm));
  document.querySelectorAll('[data-go]').forEach(el => el.onclick = e => {
    if(el.disabled) return;
    e.stopPropagation();
    goQ(+el.dataset.go);
  });
}

// 문제 이동 — 점수·시간은 그대로 유지되고, 돌아와 다시 채점하면 갱신된다
async function goQ(n){
  if(!ST || !ST.nq || n < 1 || n > ST.nq || n === ST.current) return;
  const r = await api('/api/run', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({set:SET, cmd:'go', arg:n})});
  if(r.error) return alert(r.error);
  await waitJob(r.job);
  HINT = null;
  await refresh();
}

async function run(cmd, confirmMsg){
  if(confirmMsg && !confirm(confirmMsg)) return;
  if(cmd === 'start' && ST && ST.current && !confirmMsg &&
     !confirm('시험을 시작하면 이전 진행 기록이 지워집니다. 계속할까요?')) return;

  if(cmd === 'hint'){
    if(hintShown()){            // 이미 받아 둔 힌트 — 서버를 다시 부르지 않고 접었다 편다
      HINT.open = !HINT.open;
      render();
      return;
    }
    const r = await api('/api/run', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({set:SET, cmd:'hint'})});
    if(r.error) return alert(r.error);
    const j = await waitJob(r.job);
    HINT = {q: ST.current, text: j.output.trim(), open: true};
    await refresh();
    return;
  }

  const r = await api('/api/run', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({set:SET, cmd, confirm:true})});
  if(r.error) return alert(r.error);
  JOB = {id:r.job, cmd, output:'', done:false};
  render();
  await waitJob(r.job, true);
  JOB = null;
  await refresh();
  setOptions(await api('/api/sets'));
}

async function waitJob(id, live){
  // 롱폴링 — 새 출력이 생기거나 끝나는 즉시 서버가 응답한다 (대기 시간 없음)
  let since = 0;
  for(;;){
    const j = await api(`/api/job?id=${id}&wait=1&since=${since}`);
    since = (j.output || '').length;
    if(live && JOB){ JOB.output = j.output; const el = $('#joblog'); if(el){ el.textContent = j.output; el.scrollTop = el.scrollHeight; } }
    if(j.done) return j;
  }
}

$('#sets').onchange = async e => {
  SET = e.target.value; localStorage.setItem('cka.set', SET); JOB = null; HINT = null;
  followSet();                 // 터미널도 그 세트 폴더로 따라간다
  await refresh();
};

(async () => {
  try{ CFG = await api('/api/config'); }catch(e){}
  if(CFG.shell) initTerm();
  else { $('#resizer').style.display = 'none'; $('#termcard').outerHTML = `<div class="card"><h2>터미널 꺼짐</h2>
      <p class="muted" style="margin:0;font-size:13.5px">서버가 --no-shell 로 떠 있습니다. kubectl 은 VM 터미널에서 치세요.</p></div>`; }
  await loadSets();
})();
</script>
</body>
</html>
